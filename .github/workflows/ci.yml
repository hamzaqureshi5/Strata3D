name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Ubuntu 26.04 ships VTK's Qt module built against Qt 6, which Strata3D needs
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ca-certificates \
            qt6-base-dev libvtk9-dev libvtk9-qt-dev libdcmtk-dev libvtk-dicom-dev libgl1-mesa-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTESTDICOM2MESHLIB=ON -DTESTDICOM2MESH=ON -DSTRATA3D_BUILD_UI_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Tests read lib/test/data relative to the repository root. The UI test
      # (strata3d_ui_test) is only compiled: it needs a desktop session.
      - name: Library tests
        run: ./build/lib/runLibTests

      - name: CLI tests
        run: ./build/dicom2mesh/runD2MTests
