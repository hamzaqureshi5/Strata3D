name: CI

# Kept small on purpose: one run per change (pull requests, and pushes to main
# after merging), none for documentation-only changes, and a time cap. Free for
# public repositories; private ones use the account's included minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a normal run takes about 3 minutes
    # Ubuntu 26.04 ships VTK's Qt module built against Qt 6, which Strata3D needs
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ca-certificates \
            qt6-base-dev libvtk9-dev libvtk9-qt-dev libdcmtk-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTRATA3D_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Unit tests read example/ relative to the repository root. The UI test
      # (strata3d_ui_test) is only compiled: it needs a desktop session.
      - name: Unit tests
        run: ./build/strata3d_unit_tests
